name: CD - Actualización Trello

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:

  verificar-merge:
    name: Verificar origen del cambio
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Registrar el merge
        run: |
          echo "## Cambio integrado a main vía Pull Request" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Pull Request | #${{ github.event.pull_request.number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Autor | ${{ github.event.pull_request.user.login }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Mergeado por | ${{ github.event.pull_request.merged_by.login }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.event.pull_request.merge_commit_sha }} |" >> $GITHUB_STEP_SUMMARY

  validar:
    name: Contexto y seguridad
    needs: verificar-merge
    uses: ./.github/workflows/base.yml

  trello:
    name: Actualización Trello
    needs: [verificar-merge, validar]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Mover tarjeta a CAB
        env:
          TRELLO_KEY:     ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN:   ${{ secrets.TRELLO_TOKEN }}
          TRELLO_BOARD:   ${{ needs.validar.outputs.tablero }}
          TRELLO_TICKET:  ${{ needs.validar.outputs.ticket }}
          TRELLO_COLUMNA: CAB
          TRELLO_COMENTARIO: "Tarjeta actualizada desde el Pipeline. Chequeos Digital y Ciberseguridad OK."
        run: python scripts/trello_mover.py